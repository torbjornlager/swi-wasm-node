name: Browser runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-swi
      - name: Check package tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build immutable package and archive
        run: python3 tools/package_runtime.py --output "$RUNNER_TEMP/runtime" --archive "$RUNNER_TEMP/swi-wasm-node.tgz"
      - name: Test only packaged inputs
        run: python3 "$RUNNER_TEMP/runtime/tools/test.py" --package "$RUNNER_TEMP/runtime" --report "$RUNNER_TEMP/results" --swipl "$SWIPL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-package-and-verification
          path: |
            ${{ runner.temp }}/swi-wasm-node.tgz
            ${{ runner.temp }}/results
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-package-and-verification
          path: release
      - name: Publish tested archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/swi-wasm-node.tgz --title "SWI-WASM node $GITHUB_REF_NAME" --notes "Packaged browser runtime; see the included manifest for exact source, engine and schema pins."
